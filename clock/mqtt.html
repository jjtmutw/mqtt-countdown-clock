<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202020">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="倒數計時">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>倒數計時顯示端</title>
  <script>
    (() => {
      const manifest = {
        name: "MQTT 倒數計時顯示端",
        short_name: "倒數計時",
        description: "以 MQTT 接收命令並用全螢幕翻頁時鐘顯示倒數時間。",
        start_url: window.location.href,
        scope: new URL("../", window.location.href).href,
        display: "fullscreen",
        orientation: "landscape",
        background_color: "#202020",
        theme_color: "#202020",
        icons: [
          {
            src: new URL("../icon.svg", window.location.href).href,
            sizes: "any",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(blob);
      document.head.append(link);
    })();
  </script>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon.svg">
  <link rel="stylesheet" href="../assets/styles.css?v=7">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body class="clock-body">
  <div class="design-credit">Design by PJJ</div>
  <div class="clock-status" id="clockStatus">Offline</div>
  <button class="install-button" id="installButton" type="button">全螢幕</button>
  <main class="clock-shell">
    <section class="clock-stage" aria-label="倒數計時翻頁時鐘">
      <div class="clock-title" id="clockTitle">倒數時間總計 10:00</div>
      <div class="flip-row" aria-label="目前倒數時間">
        <div class="flip-card" data-digit="0"><span class="flip-digit">0</span></div>
        <div class="flip-card" data-digit="1"><span class="flip-digit">0</span></div>
        <div class="flip-separator" aria-hidden="true"><span></span><span></span></div>
        <div class="flip-card" data-digit="2"><span class="flip-digit">1</span></div>
        <div class="flip-card" data-digit="3"><span class="flip-digit">0</span></div>
        <div class="flip-separator" aria-hidden="true"><span></span><span></span></div>
        <div class="flip-card" data-digit="4"><span class="flip-digit">0</span></div>
        <div class="flip-card" data-digit="5"><span class="flip-digit">0</span></div>
      </div>
      <div class="clock-message" id="clockMessage">等待倒數命令</div>
    </section>
  </main>
  <script src="../assets/clock.js?v=7"></script>
</body>
</html>
